run:
  experiment_type: "generate-dataset"
  rng_seed: 43

net_ranges:
  # n: [1000, 2800]
  # n: [4600, 6400]
  n: [8200, 10000]
  t1: [2.0, 3.0]
  t2: [1.0, 2.0]
  xi: [0.01, 1.0]
  d_min_frac: [1.e-10, 0.005] # fraction of n, 1e-10 used to force lower bound of 1
  d_max_frac: [0.005, 0.5] # fraction of n, >= d_min_frac
  c_min_frac: [1.e-10, 0.05] # fraction of n, 1e-10 used to force lower bound of 1
  c_max_frac: [0.05, 0.5] # fraction of n, >= c_min_frac; capped at n
  nout_frac: [0.0, 0.05] # fraction of n  →  nout = round(nout_frac * n)
  d_max_iter: 1000 # zmeinic 5-10
  c_max_iter: 1000 # zmienic
  islocal: false
  isCL: false
  edges_filename: edges.dat
  communities_filename: communities.dat

generator:
  net_type: "abcd"
  # out_dir: "./data/abcd-final/chunk-1"
  # out_dir: "./data/abcd-final/chunk-2"
  out_dir: "./data/abcd-final/chunk-3"
  # sampling:
  #   method: "random"
  #   instances: 10
  #   max_trials: 3
  #   replicas: 5

  # Uniform grid sampling — uncomment and replace the sampling block above to switch modes.
  # Uniform grid: one step count applied to every range parameter.
  # sampling:
  #   method: "grid"
  #   grid_steps: 5
  #   replicas: 10

  # Irregular grid: per-parameter step counts (every range parameter must be listed).
  # sampling:
  #   method: "grid"
  #   grid_steps:
  #     n: 5
  #     t1: 3
  #     t2: 3
  #     xi: 5
  #     d_min_frac: 3
  #     d_max_frac: 5
  #     c_min_frac: 3
  #     c_max_frac: 5
  #     nout_frac: 3
  #   replicas: 10

  # Borderline sampling: sampling graphs from all combinations of min and max values of the parameter ranges.
  sampling:
    method: "borderline"
    replicas: 10

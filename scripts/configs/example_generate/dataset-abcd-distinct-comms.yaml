run:
  experiment_type: "generate-dataset"
  rng_seed: 41
  timeout: null # seconds; omit to disable

net_ranges:
  n: [1000, 5000]
  t1: [2.0, 3.0]
  t2: [1.0, 2.0]
  xi: [0.01, 0.2]
  d_min_frac: [1.e-10, 0.005] # fraction of n, 1e-10 used to force lower bound of 1
  d_max_frac: [0.005, 0.1] # fraction of n, >= d_min_frac
  c_min_frac: [0.001, 0.01] # fraction of n, 1e-10 used to force lower bound of 1
  c_max_frac: [0.01, 0.1] # fraction of n, >= c_min_frac; capped at n
  nout_frac: 0.0 # fraction of n  →  nout = round(nout_frac * n)
  d_max_iter: 10
  c_max_iter: 10
  islocal: false
  isCL: false
  edges_filename: edges.dat
  communities_filename: communities.dat

generator:
  net_type: "abcd"
  out_dir: "./examples/abcd-distinct-comms"
  # Random sampling: random draws from the parameter ranges, with replacement.
  sampling:
    method: "random"
    instances: 200
    max_trials: 3
    replicas: 10

run:
  experiment_type: "generate-dataset"
  rng_seed: 43

net_ranges:
  n: [1000, 10000]
  t1: [2.0, 4.0]
  t2: [1.5, 3.0]
  xi: [0.01, 1.0]
  d_min_frac: [0.0005, 0.005] # fraction of n  →  d_min = round(d_min_frac * n)
  d_max_frac: [0.005, 0.05] # fraction of n, >= d_min_frac
  c_min_frac: [0.005, 0.05] # fraction of n
  c_max_frac: [0.05, 0.3] # fraction of n, >= c_min_frac; capped at n
  nout_frac: [0.0, 0.01] # fraction of n
  d_max_iter: 1000
  c_max_iter: 1000
  islocal: false
  isCL: false
  edges_filename: edges.dat
  communities_filename: communities.dat

generator:
  net_type: "abcd"
  out_dir: "./examples/generate_dataset-abcd"
  sampling:
    method: "random"
    instances: 10
    max_trials: 3
    replicas: 5

  # Grid sampling — uncomment and replace the sampling block above to switch modes.
  # sampling:
  #   method: "grid"
  #   grid_steps: 5
  #   replicas: 3
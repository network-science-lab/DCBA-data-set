run:
  experiment_type: "generate-dataset"
  rng_seed: 7

# TODO - this should be further modified to draw n-layered networks!
net_ranges:
  n: [500, 3000]
  seed: null # placeholder, overwritten by DatasetGenerator
  edges_cor:
    - [1.0, 0.25, 0.10]
    - [0.25, 1.0, 0.30]
    - [0.10, 0.30, 1.0]
  layer_params:
    q: [1.0, 0.6, 0.3]
    tau: [1.0, 0.6, 0.3]
    r: [1.0, 0.6, 0.3]
    gamma: [2.5, 2.8, 3.0]
    delta: [0.0020, 0.0035, 0.0060]
    Delta: [0.0250, 0.0400, 0.0600]
    beta: [1.5, 1.6, 1.8]
    s: [0.0080, 0.0140, 0.0200]
    S: [0.0320, 0.0560, 0.0800]
    xi: [0.15, 0.25, 0.35]
  d_max_iter: 1000
  c_max_iter: 1000
  t: 100
  eps: [0.01, 0.1]
  d: 2
  edges_filename: edges.dat
  communities_filename: communities.dat

generator:
  net_type: "mabcd"
  replicas: 5 # number of networks to generate from the given configuration
  instances: 10 # number of valid configurations to use
  max_trials: 3 # maximum number of trials to sample a valid configuration
  out_dir: "./examples/generate_dataset-mabcd" # directory to save data in

# Total number of generated networks is replicas * instances

[project]
name = "dcba-data-set"
version = "0.7.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Czuba", email = "michal.czuba.1995@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.66.1",
    "dvc-gdrive>=3.0.1",
    "gitpython>=3.1.46",
    "juliacall~=0.9.24",
    "numpy~=2.0.0",
    "pandas~=2.2.3",
    "pydantic>=2.0",
    "pyyaml~=6.0.1",
    "tqdm~=4.66.4",
    "bidict>=0.22",
    "torch-geometric>=2.5",
    "torch>=2.5.1",
    "pyg-lib>=0.4.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "pre-commit>=4.5.1",
    "powerlaw>=2.0.0",
]

[project.scripts]
dcba-data-set = "dcba_data_set.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Suppress known third-party warnings that cannot be fixed in this codebase:
# - torch_geometric 2.7.0 bug: llm/utils/backend_utils.py still imports from
#   torch_geometric.distributed, which emits a deprecation warning since 2.7.0.
#   No newer release is available to upgrade to.
filterwarnings = [
    "ignore:.*torch_geometric\\.distributed.*has been deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.5.1+cu121.html"]
no-build-package = ["torch-scatter", "torch-sparse", "pyg-lib"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
